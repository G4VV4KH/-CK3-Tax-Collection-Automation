l_korean:
 tca_automation_label:0 "세금 징수 자동화"
 tca_automation_tooltip:0 "공석인 세금 징수관을 임명하고, 현직보다 적성이 높은 후보자가 있을 때만 교체합니다. 현재 조세 칙령에 따라 더 많은 금화를 제공하는, 여유가 있는 관할 구역에 납세자를 배정합니다.\n\n세금 패널을 열어 둬도 됩니다. 활성화 직후와 매월 확인하며, 다른 창이 열려 있으면 확인이 늦어질 수 있습니다. 확인 중에는 수동 세금 관리가 비활성화되지만 자동화 체크박스는 계속 사용할 수 있습니다. 가득 찬 관할 구역도 합산 금화 수입이 늘어나는 경우 납세자를 맞바꿉니다. 교환 중에는 게임이 잠시 일시 정지됩니다. 비활성화하면 새 확인을 중단하며, 중단된 교환은 먼저 되돌립니다."
 tca_automation_recovery_warning:0 "관할 구역 조건이 바뀌어 교환을 중단했습니다. 배정을 확인한 뒤 자동화를 다시 켜서 복구를 재시도하세요."
 tca_confirmation_title_template:0 "[GetVariableSystem.Get('tca_confirmation_incumbent_name')] 교체"
