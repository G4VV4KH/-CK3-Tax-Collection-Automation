l_french:
 tca_automation_label:0 "Automatiser la collecte des impôts"
 tca_automation_tooltip:0 "Pourvoit les postes vacants de collecteur d’impôts et remplace un titulaire uniquement si un candidat possède une aptitude supérieure. Affecte les contribuables à une juridiction disponible dont le décret fiscal actuel rapporte davantage d’or.\n\nLe panneau des impôts peut rester ouvert. Vérifie après activation et une fois par mois ; d’autres fenêtres ouvertes peuvent retarder une vérification. Les commandes fiscales manuelles sont indisponibles pendant la vérification, mais la case d’automatisation reste utilisable. Échange aussi des contribuables entre juridictions pleines si leur or total augmente. Le jeu se met brièvement en pause pendant l’échange. La désactivation arrête les nouvelles vérifications ; un échange interrompu est d’abord annulé."
 tca_automation_recovery_warning:0 "Échange arrêté après un changement des conditions des juridictions. Vérifiez les affectations, puis réactivez l’automatisation pour relancer la restauration."
 tca_confirmation_title_template:0 "Remplacer [GetVariableSystem.Get('tca_confirmation_incumbent_fr_article')][GetVariableSystem.Get('tca_confirmation_incumbent_name')]"
