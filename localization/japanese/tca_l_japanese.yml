l_japanese:
 tca_automation_label:0 "徴税を自動化"
 tca_automation_tooltip:0 "空席の徴税官を任命し、現任者より適性の高い候補者がいる場合のみ交代させます。現在の税制でより多くの金を得られる、空きのある徴税管区に納税者を割り当てます。\n\n徴税パネルは開いたままでも構いません。有効化時と毎月確認しますが、ほかのウィンドウが開いていると確認が遅れる場合があります。確認中は手動の徴税操作が無効になりますが、自動化のチェックボックスは操作できます。満員の徴税管区間でも、合計金収入が増える場合は納税者を入れ替えます。交換中はゲームが短時間一時停止します。無効化すると新しい確認を停止し、中断した交換を先に元に戻します。"
 tca_automation_recovery_warning:0 "徴税管区の条件が変わったため交換を停止しました。割り当てを確認し、自動化を再度有効にして復元を再試行してください。"
 tca_confirmation_title_template:0 "[GetVariableSystem.Get('tca_confirmation_incumbent_name')]の入替"
