l_russian:
 tca_automation_label:0 "Автоматизировать сбор налогов"
 tca_automation_tooltip:0 "Заполняет свободные должности сборщиков налогов и заменяет действующего сборщика, только если найден кандидат с более высокой пригодностью. Переводит налогоплательщиков в доступную юрисдикцию, где действующий налоговый указ даёт больше золота.\n\nПанель налогов можно оставлять открытой. Проверяет после включения и раз в месяц; другие открытые окна могут отложить проверку. На время проверки ручное управление налогами недоступно, но чекбокс автоматизации остаётся доступен. В заполненных юрисдикциях также меняет налогоплательщиков местами, если их суммарный доход растёт. На время обмена игра ненадолго ставится на паузу. Отключение останавливает новые проверки; прерванный обмен сначала отменяется."
 tca_automation_recovery_warning:0 "Обмен остановлен из-за изменения условий юрисдикций. Проверьте распределение налогоплательщиков и включите автоматизацию снова, чтобы повторить восстановление."
 tca_confirmation_title_template:0 "[GetVariableSystem.Get('tca_confirmation_incumbent_name')] — заменить"
